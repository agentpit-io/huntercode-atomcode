# HunterCode · AtomCode 发行版 · 依赖锁定
# 格式：TOML。所有校验值均为 2026-09-22（上海时间）在测试机 34.133.8.3 实测所得。
# 校验不过即视为失败，不得跳过。

[atomcode]
version      = "5.1.0"
# 上游 release 元数据（仓库根 latest.json，commit 254d14a84）
upstream_repo         = "https://atomgit.com/atomgit_atomcode/atomcode"
upstream_latest_json  = "latest.json @ 254d14a84 (chore: sync latest.json from release v5.1.0)"
released_at           = "2026-09-18T21:52:00+08:00"

# ── 采用的获取方式 ──
# atomgit 的 release 直链在美国机房返回 418，因此走 npm registry 取包。
# **实测结论：npm 包内的二进制与上游 latest.json 记录的是同一文件**
# （sha256 与 size 逐字节一致），因此**主校验用 latest.json 的 sha256**，
# npm 的 dist.integrity 作为对 tgz 的附加校验（两条都已验过，见 docs/开发文档/M0-预研结论.md §1）。
source_type  = "npm"
npm_package  = "@atomgit.com/atomcode"
npm_version  = "5.1.0-linux-x64"
npm_tarball  = "https://registry.npmjs.org/@atomgit.com/atomcode/-/atomcode-5.1.0-linux-x64.tgz"
# npm registry 给出的 dist.integrity，与本地 `openssl dgst -sha512 | base64` 一致
npm_dist_integrity = "sha512-PiaNhFzzilBvqCV5n7EMahvXdUv1AfKq0WTJUdNHSQc8IItcp371nHSlXhwBtpnd1zp21643W8q/DDvU280jYw=="
npm_dist_shasum    = "e5cb1b098d673072dae82c9434372cdfe11c18fb"
npm_tgz_sha256     = "220ea8d7b31c4482b7235fa251d266be080f8fedbf6d89d44f4cf642bfc872f5"
binary_path_in_tgz = "package/bin/atomcode"

# 主校验：解包出的二进制。sha256 与 size 同时匹配 latest.json 的 linux-x64 条目。
# 额外旁证：daemon 的 GET /health 会回显 binary_hash，值与此相同。
[atomcode.binaries.linux-x64]
sha256 = "40d86fa3e31980dbcdc8a6e5707c822f3953284ff76b31523789ca19988c8763"
size   = 40214480
verified_on = "2026-09-22 00:24 Asia/Shanghai · hunter-test-01(34.133.8.3)"
version_output = "atomcode 5.1.0 (unknown)"

# ── fork 变体（I2，决策 14）────────────────────────────────────────────────
# 用户 2026-09-23 00:55 拍板「fork 无条件做」。补丁只做提速需要的三件事：
# 人设可由配置整体替换、工具挂载白名单、按族关掉工具（含代码类工具族）。
# 未配置时行为与上游一致（补丁自带两条「未配置时不变」的单测）。
#
# **构建目标三元组是默认的 x86_64-unknown-linux-gnu，不是上游 CI 里写的 musl。**
# 理由：实测 npm 发布件里那个二进制是 glibc 链接的（PT_INTERP = /lib64/ld-linux…），
# 而 daemon 镜像底座 python:3.12-slim-bookworm 里没有 musl 的动态链接器 ——
# 按 musl 编出来的产物在那个镜像里根本起不来。对齐的是发布件的实际链接方式。
[atomcode.fork]
base_version = "5.1.0"
base_tag     = "v5.1.0"           # 上游 commit 72b538e8c
patch        = "docs/fork-patch/apply.py"   # 幂等；产物与本条 sha256 逐字节对应
build        = "rust stable 1.98.1 / Debian 12 / cargo build --release（默认 gnu 三元组）"
sha256       = "2c2653b084ef8b509f47cbfde414c3e0e23fe255541c2d1a19874628fd7728c8"
size         = 38992264
built_on     = "2026-09-23 01:27 Asia/Shanghai · 开发机 docker（rust:1-bookworm）"
image        = "hca-daemon:<tag>-fork（deploy/Dockerfile.daemon-fork 在基础镜像上叠一层，自带同一道 sha256 校验）"
upstream_pr  = "docs/fork-patch/PR.md（待提交）"

